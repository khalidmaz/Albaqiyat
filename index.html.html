<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="عداد التسبيح" />
  <title>عداد التسبيح</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --surface-bg: #334155;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent: #10b981;
      --accent-soft: rgba(16, 185, 129, 0.16);
      --danger: #ef4444;
      --border: rgba(148, 163, 184, 0.18);
      --dhikr-font-size: 26px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Arabic", "Segoe UI", Tahoma, sans-serif;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: var(--bg-color);
      color: var(--text-primary);
      overflow: hidden;
    }

    .app-container {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-width: 480px;
      margin: 0 auto;
      padding-top: calc(env(safe-area-inset-top, 16px) + 8px);
      padding-bottom: calc(env(safe-area-inset-bottom, 16px) + 8px);
      padding-left: 16px;
      padding-right: 16px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 0 12px;
      gap: 8px;
    }

    .header-title {
      font-size: 19px;
      font-weight: 700;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-primary);
      border-radius: 12px;
      height: 40px;
      padding: 0 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .icon-btn:active {
      transform: scale(0.96);
    }

    .icon-btn.accent {
      background: var(--accent);
      color: #052e16;
      border-color: transparent;
    }

    .selector-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 10px;
      scrollbar-width: none;
    }

    .selector-bar::-webkit-scrollbar {
      display: none;
    }

    .chip {
      flex: 0 0 auto;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .chip.active {
      background: var(--accent-soft);
      color: var(--accent);
      border-color: var(--accent);
    }

    .main-card {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 16px;
      overflow: hidden;
      position: relative;
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    .badge {
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
    }

    .card-tools {
      display: flex;
      gap: 6px;
    }

    .mini-btn {
      background: var(--surface-bg);
      border: none;
      color: var(--text-primary);
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .mini-btn.danger {
      background: rgba(239, 68, 68, 0.16);
      color: #fca5a5;
    }

    .steps-indicator {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
    }

    .step-pill {
      flex: 1;
      height: 5px;
      border-radius: 999px;
      background: var(--surface-bg);
      transition: background 0.2s;
    }

    .step-pill.done {
      background: var(--accent);
    }

    .step-pill.current {
      background: var(--text-primary);
    }

    .tap-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
      padding: 10px 6px;
      cursor: pointer;
      border-radius: 18px;
    }

    .dhikr-text-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      overflow-y: auto;
      padding: 6px 4px;
    }

    .dhikr-text {
      font-size: var(--dhikr-font-size);
      font-weight: 700;
      line-height: 1.65;
      margin: 0;
      color: var(--text-primary);
    }

    .dhikr-virtue {
      margin-top: 10px;
      font-size: 13px;
      line-height: 1.5;
      color: var(--text-secondary);
      background: rgba(15, 23, 42, 0.35);
      padding: 8px 12px;
      border-radius: 12px;
      max-width: 100%;
    }

    .counter-ring {
      width: 164px;
      height: 164px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, var(--surface-bg), var(--bg-color));
      border: 4px solid var(--accent);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
      margin: 10px 0 6px;
      transition: transform 0.08s ease;
    }

    .tap-area:active .counter-ring {
      transform: scale(0.95);
    }

    .count-number {
      font-size: 46px;
      font-weight: 800;
      line-height: 1;
      color: var(--text-primary);
      font-variant-numeric: tabular-nums;
    }

    .count-label {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 6px;
      font-weight: 600;
    }

    .bottom-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      gap: 8px;
    }

    .total-badge {
      font-size: 13px;
      color: var(--text-secondary);
      font-weight: 600;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.78);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 50;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-sheet {
      width: 100%;
      max-width: 480px;
      max-height: 88dvh;
      background: var(--card-bg);
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      padding: 18px 16px calc(env(safe-area-inset-bottom, 16px) + 16px);
      overflow-y: auto;
      border-top: 1px solid var(--border);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .modal-title {
      font-size: 17px;
      font-weight: 700;
      margin: 0;
    }

    .field-group {
      margin-bottom: 12px;
    }

    .field-label {
      display: block;
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 6px;
      font-weight: 600;
    }

    input[type="text"], input[type="number"], textarea {
      width: 100%;
      background: var(--bg-color);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text-primary);
      padding: 10px 12px;
      font-size: 15px;
      user-select: text;
    }

    textarea {
      resize: vertical;
      min-height: 64px;
    }

    .step-edit-row {
      background: rgba(15, 23, 42, 0.45);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px;
      margin-bottom: 10px;
    }

    .step-edit-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      font-size: 12px;
      color: var(--text-secondary);
      font-weight: 700;
    }

    .theme-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }

    .theme-option {
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      background: var(--bg-color);
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 600;
    }

    .theme-option.active {
      border-color: var(--accent);
    }

    .swatch {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .full-btn {
      width: 100%;
      padding: 12px;
      border-radius: 14px;
      border: none;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 6px;
    }

    .full-btn.primary {
      background: var(--accent);
      color: #052e16;
    }

    .full-btn.secondary {
      background: var(--surface-bg);
      color: var(--text-primary);
    }
  </style>
</head>
<body>
  <div class="app-container">
    <header>
      <h1 class="header-title">📿 عداد التسبيح</h1>
      <div class="header-actions">
        <button class="icon-btn accent" id="openAddBtn">+ إضافة ذكر</button>
        <button class="icon-btn" id="openSettingsBtn">🎨 المظهر</button>
      </div>
    </header>

    <div class="selector-bar" id="dhikrListBar"></div>

    <main class="main-card">
      <div class="card-top">
        <span class="badge" id="stepBadge">الذكر</span>
        <div class="card-tools">
          <button class="mini-btn" id="editCurrentBtn">تعديل</button>
          <button class="mini-btn danger" id="deleteCurrentBtn">حذف</button>
        </div>
      </div>

      <div class="steps-indicator" id="stepsIndicator"></div>

      <div class="tap-area" id="tapArea">
        <div class="dhikr-text-wrapper">
          <p class="dhikr-text" id="dhikrText"></p>
          <div class="dhikr-virtue" id="dhikrVirtue"></div>
        </div>

        <div class="counter-ring">
          <div class="count-number" id="countDisplay">0</div>
          <div class="count-label" id="countSubLabel">اضغط للتسبيح</div>
        </div>
      </div>

      <div class="bottom-controls">
        <span class="total-badge" id="totalSessionLabel">المجموع الكلي: 0</span>
        <button class="mini-btn" id="resetStepBtn">إعادة ضبط الذكر</button>
      </div>
    </main>
  </div>

  <!-- Modal: Add / Edit Dhikr -->
  <div class="modal-backdrop" id="formModal">
    <div class="modal-sheet">
      <div class="modal-header">
        <h2 class="modal-title" id="formModalTitle">إضافة ذكر جديد</h2>
        <button class="mini-btn" id="closeFormModal">إغلاق</button>
      </div>

      <div class="field-group">
        <label class="field-label">اسم الذكر أو المجموعة</label>
        <input type="text" id="inputTitle" placeholder="مثال: أذكار الصباح أو استغفار" />
      </div>

      <div class="field-group">
        <label class="field-label">الفضل أو الملاحظة (اختياري)</label>
        <input type="text" id="inputVirtue" placeholder="مثال: من قالها مائة مرة حطت خطاياه..." />
      </div>

      <div class="field-group">
        <label class="field-label">خطوات التسبيح (اجعل العدد 0 للتسبيح المفتوح)</label>
        <div id="stepsEditorContainer"></div>
        <button type="button" class="full-btn secondary" id="addStepRowBtn">+ إضافة خطوة تسبيح أخرى</button>
      </div>

      <button type="button" class="full-btn primary" id="saveDhikrBtn">حفظ الذكر</button>
    </div>
  </div>

  <!-- Modal: Appearance Settings -->
  <div class="modal-backdrop" id="settingsModal">
    <div class="modal-sheet">
      <div class="modal-header">
        <h2 class="modal-title">تخصيص الألوان وحجم الخط</h2>
        <button class="mini-btn" id="closeSettingsModal">تم</button>
      </div>

      <div class="field-group">
        <label class="field-label">اختر سمة الألوان</label>
        <div class="theme-grid" id="themeGrid"></div>
      </div>

      <div class="field-group">
        <label class="field-label">حجم خط نص التسبيح: <span id="fontSizeValue">26</span>px</label>
        <input type="range" id="fontSizeRange" min="18" max="40" value="26" style="width:100%;" />
      </div>
    </div>
  </div>

  <script>
    const DEFAULT_ADHKAR = [
      {
        id: "d1",
        title: "سبحان الله وبحمده (100)",
        virtue: "من قالها في يوم مائة مرة حُطَّت خطاياه وإن كانت مثل زبد البحر.",
        steps: [{ text: "سُبْحَانَ اللَّهِ وَبِحَمْدِهِ", target: 100 }]
      },
      {
        id: "d2",
        title: "التهليل المضاعف (100)",
        virtue: "كانت له عدل عشر رقاب، وكُتبت له مائة حسنة، ومُحيت عنه مائة سيئة، وكانت له حرزاً من الشيطان.",
        steps: [{ text: "لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ", target: 100 }]
      },
      {
        id: "d3",
        title: "التسبيح دبر كل صلاة",
        virtue: "غُفرت خطاياه وإن كانت مثل زبد البحر (33 تسبيحة، 33 تحميدة، 33 تكبيرة، وتمام المائة التهليل).",
        steps: [
          { text: "سُبْحَانَ اللَّهِ", target: 33 },
          { text: "الْحَمْدُ لِلَّهِ", target: 33 },
          { text: "اللَّهُ أَكْبَرُ", target: 33 },
          { text: "لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ", target: 1 }
        ]
      },
      {
        id: "d4",
        title: "التسبيح عند النوم",
        virtue: "أوصى به النبي ﷺ ابنته فاطمة وعلياً رضي الله عنهما عند أخذ مضاجعهما للنوم.",
        steps: [
          { text: "سُبْحَانَ اللَّهِ", target: 33 },
          { text: "الْحَمْدُ لِلَّهِ", target: 33 },
          { text: "اللَّهُ أَكْبَرُ", target: 34 }
        ]
      },
      {
        id: "d5",
        title: "سبحان الله عدد خلقه (3)",
        virtue: "أربع كلمات تعدل من الأجر أضعافاً مضاعفة لمن قالها ثلاث مرات صباحاً.",
        steps: [{ text: "سُبْحَانَ اللَّهِ وَبِحَمْدِهِ: عَدَدَ خَلْقِهِ، وَرِضَا نَفْسِهِ، وَزِنَةَ عَرْشِهِ، وَمِدَادَ كَلِمَاتِهِ", target: 3 }]
      },
      {
        id: "d6",
        title: "الباقيات الصالحات (مفتوح)",
        virtue: "أحب الكلام إلى الله أربع: سبحان الله، والحمد لله، ولا إله إلا الله، والله أكبر.",
        steps: [{ text: "سُبْحَانَ اللَّهِ، وَالْحَمْدُ لِلَّهِ، وَلَا إِلَهَ إِلَّا اللَّهُ، وَاللَّهُ أَكْبَرُ", target: 0 }]
      },
      {
        id: "d7",
        title: "كلمتان خفيفتان (مفتوح)",
        virtue: "كلمتان خفيفتان على اللسان، ثقيلتان في الميزان، حبيبتان إلى الرحمن.",
        steps: [{ text: "سُبْحَانَ اللَّهِ وَبِحَمْدِهِ، سُبْحَانَ اللَّهِ الْعَظِيمِ", target: 0 }]
      },
      {
        id: "d8",
        title: "الحوقلة (مفتوح)",
        virtue: "كنز من كنوز الجنة.",
        steps: [{ text: "لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ", target: 0 }]
      }
    ];

    const THEMES = [
      { id: "emerald", name: "الزمردي الداكن", bg: "#0f172a", card: "#1e293b", surface: "#334155", text: "#f8fafc", sub: "#94a3b8", accent: "#10b981" },
      { id: "gold", name: "الذهبي الملكي", bg: "#141210", card: "#221e1a", surface: "#363029", text: "#faf7f2", sub: "#b8aea0", accent: "#eab308" },
      { id: "blue", name: "الأزرق الهادئ", bg: "#0b132b", card: "#1c2541", surface: "#2c3a63", text: "#f1f5f9", sub: "#94a3b8", accent: "#38bdf8" },
      { id: "light", name: "النهاري الفاتح", bg: "#f1f5f9", card: "#ffffff", surface: "#e2e8f0", text: "#0f172a", sub: "#475569", accent: "#059669" }
    ];

    let state = {
      adhkar: JSON.parse(localStorage.getItem("tasbih_adhkar_v1")) || DEFAULT_ADHKAR,
      selectedId: localStorage.getItem("tasbih_selected_v1") || "d1",
      stepIndex: 0,
      remaining: 100,
      totalCount: Number(localStorage.getItem("tasbih_total_v1") || 0),
      themeId: localStorage.getItem("tasbih_theme_v1") || "emerald",
      fontSize: Number(localStorage.getItem("tasbih_fontsize_v1") || 26),
      editingId: null
    };

    function saveState() {
      localStorage.setItem("tasbih_adhkar_v1", JSON.stringify(state.adhkar));
      localStorage.setItem("tasbih_selected_v1", state.selectedId);
      localStorage.setItem("tasbih_total_v1", String(state.totalCount));
      localStorage.setItem("tasbih_theme_v1", state.themeId);
      localStorage.setItem("tasbih_fontsize_v1", String(state.fontSize));
    }

    function applyTheme() {
      const t = THEMES.find(x => x.id === state.themeId) || THEMES[0];
      const root = document.documentElement.style;
      root.setProperty("--bg-color", t.bg);
      root.setProperty("--card-bg", t.card);
      root.setProperty("--surface-bg", t.surface);
      root.setProperty("--text-primary", t.text);
      root.setProperty("--text-secondary", t.sub);
      root.setProperty("--accent", t.accent);
      root.setProperty("--dhikr-font-size", state.fontSize + "px");
      document.getElementById("fontSizeRange").value = state.fontSize;
      document.getElementById("fontSizeValue").textContent = state.fontSize;
    }

    function getCurrentDhikr() {
      let item = state.adhkar.find(d => d.id === state.selectedId);
      if (!item && state.adhkar.length > 0) {
        item = state.adhkar[0];
        state.selectedId = item.id;
      }
      return item;
    }

    function selectDhikr(id) {
      state.selectedId = id;
      state.stepIndex = 0;
      const item = getCurrentDhikr();
      if (item && item.steps.length > 0) {
        const target = Number(item.steps[0].target) || 0;
        state.remaining = target > 0 ? target : 0;
      }
      saveState();
      render();
    }

    function render() {
      const bar = document.getElementById("dhikrListBar");
      bar.innerHTML = "";
      state.adhkar.forEach(item => {
        const btn = document.createElement("button");
        btn.className = "chip" + (item.id === state.selectedId ? " active" : "");
        btn.textContent = item.title;
        btn.onclick = () => selectDhikr(item.id);
        bar.appendChild(btn);
      });

      const current = getCurrentDhikr();
      const indicator = document.getElementById("stepsIndicator");
      indicator.innerHTML = "";

      if (!current) {
        document.getElementById("dhikrText").textContent = "لا توجد أذكار. اضغط (+ إضافة ذكر) للبدء.";
        document.getElementById("dhikrVirtue").style.display = "none";
        document.getElementById("countDisplay").textContent = "0";
        return;
      }

      const steps = current.steps || [];
      if (state.stepIndex >= steps.length) state.stepIndex = 0;
      const activeStep = steps[state.stepIndex];

      if (steps.length > 1) {
        indicator.style.display = "flex";
        steps.forEach((_, idx) => {
          const pill = document.createElement("div");
          pill.className = "step-pill" + (idx < state.stepIndex ? " done" : idx === state.stepIndex ? " current" : "");
          indicator.appendChild(pill);
        });
        document.getElementById("stepBadge").textContent = `الخطوة ${state.stepIndex + 1} من ${steps.length}`;
      } else {
        indicator.style.display = "none";
        document.getElementById("stepBadge").textContent = activeStep.target > 0 ? `الهدف: ${activeStep.target}` : "تسبيح مفتوح";
      }

      document.getElementById("dhikrText").textContent = activeStep.text;
      const virtueEl = document.getElementById("dhikrVirtue");
      if (current.virtue && current.virtue.trim()) {
        virtueEl.style.display = "block";
        virtueEl.textContent = current.virtue;
      } else {
        virtueEl.style.display = "none";
      }

      document.getElementById("countDisplay").textContent = state.remaining;
      document.getElementById("countSubLabel").textContent = activeStep.target > 0 ? "المتبقي (تنازلي)" : "العدد الحالي (تصاعدي)";
      document.getElementById("totalSessionLabel").textContent = `المجموع الكلي: ${state.totalCount}`;
    }

    function vibrate(ms) {
      if (navigator.vibrate) navigator.vibrate(ms);
    }

    document.getElementById("tapArea").addEventListener("click", () => {
      const current = getCurrentDhikr();
      if (!current) return;
      const activeStep = current.steps[state.stepIndex];
      const target = Number(activeStep.target) || 0;

      state.totalCount += 1;

      if (target > 0) {
        if (state.remaining > 1) {
          state.remaining -= 1;
          vibrate(15);
        } else {
          vibrate([40, 40, 60]);
          if (state.stepIndex + 1 < current.steps.length) {
            state.stepIndex += 1;
            const nextTarget = Number(current.steps[state.stepIndex].target) || 0;
            state.remaining = nextTarget > 0 ? nextTarget : 0;
          } else {
            state.stepIndex = 0;
            const firstTarget = Number(current.steps[0].target) || 0;
            state.remaining = firstTarget > 0 ? firstTarget : 0;
          }
        }
      } else {
        state.remaining += 1;
        vibrate(15);
      }

      saveState();
      render();
    });

    document.getElementById("resetStepBtn").addEventListener("click", () => {
      const current = getCurrentDhikr();
      if (!current) return;
      state.stepIndex = 0;
      const firstTarget = Number(current.steps[0].target) || 0;
      state.remaining = firstTarget > 0 ? firstTarget : 0;
      render();
    });

    document.getElementById("deleteCurrentBtn").addEventListener("click", () => {
      const current = getCurrentDhikr();
      if (!current) return;
      if (state.adhkar.length <= 1) {
        alert("يجب الإبقاء على ذكر واحد على الأقل.");
        return;
      }
      if (confirm(`هل تريد حذف "${current.title}"؟`)) {
        state.adhkar = state.adhkar.filter(d => d.id !== current.id);
        selectDhikr(state.adhkar[0].id);
      }
    });

    function addStepEditorRow(text = "", target = 33) {
      const container = document.getElementById("stepsEditorContainer");
      const row = document.createElement("div");
      row.className = "step-edit-row";
      row.innerHTML = `
        <div class="step-edit-top">
          <span>خطوة تسبيح</span>
          <button type="button" class="mini-btn danger remove-step-btn">حذف الخطوة</button>
        </div>
        <textarea class="step-text-input" placeholder="نص الذكر...">${text}</textarea>
        <div style="margin-top:6px;">
          <input type="number" class="step-target-input" min="0" value="${target}" placeholder="العدد (0 = مفتوح)" />
        </div>
      `;
      row.querySelector(".remove-step-btn").onclick = () => {
        if (container.children.length > 1) {
          row.remove();
        } else {
          alert("يجب أن يحتوي الذكر على خطوة واحدة على الأقل.");
        }
      };
      container.appendChild(row);
    }

    document.getElementById("openAddBtn").addEventListener("click", () => {
      state.editingId = null;
      document.getElementById("formModalTitle").textContent = "إضافة ذكر جديد";
      document.getElementById("inputTitle").value = "";
      document.getElementById("inputVirtue").value = "";
      document.getElementById("stepsEditorContainer").innerHTML = "";
      addStepEditorRow("", 33);
      document.getElementById("formModal").classList.add("open");
    });

    document.getElementById("editCurrentBtn").addEventListener("click", () => {
      const current = getCurrentDhikr();
      if (!current) return;
      state.editingId = current.id;
      document.getElementById("formModalTitle").textContent = "تعديل الذكر وخطواته";
      document.getElementById("inputTitle").value = current.title;
      document.getElementById("inputVirtue").value = current.virtue || "";
      document.getElementById("stepsEditorContainer").innerHTML = "";
      current.steps.forEach(s => addStepEditorRow(s.text, s.target));
      document.getElementById("formModal").classList.add("open");
    });

    document.getElementById("addStepRowBtn").addEventListener("click", () => addStepEditorRow("", 33));
    document.getElementById("closeFormModal").addEventListener("click", () => document.getElementById("formModal").classList.remove("open"));

    document.getElementById("saveDhikrBtn").addEventListener("click", () => {
      const title = document.getElementById("inputTitle").value.trim();
      const virtue = document.getElementById("inputVirtue").value.trim();
      const rows = document.querySelectorAll("#stepsEditorContainer .step-edit-row");
      const steps = [];
      rows.forEach(r => {
        const txt = r.querySelector(".step-text-input").value.trim();
        const tgt = Math.max(0, parseInt(r.querySelector(".step-target-input").value, 10) || 0);
        if (txt) steps.push({ text: txt, target: tgt });
      });

      if (!title || steps.length === 0) {
        alert("يرجى إدخال اسم الذكر ونص خطوة واحدة على الأقل.");
        return;
      }

      if (state.editingId) {
        const idx = state.adhkar.findIndex(d => d.id === state.editingId);
        if (idx !== -1) {
          state.adhkar[idx] = { id: state.editingId, title, virtue, steps };
        }
        selectDhikr(state.editingId);
      } else {
        const newId = "custom_" + Date.now();
        state.adhkar.push({ id: newId, title, virtue, steps });
        selectDhikr(newId);
      }

      document.getElementById("formModal").classList.remove("open");
    });

    // Settings Modal
    const themeGrid = document.getElementById("themeGrid");
    THEMES.forEach(t => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "theme-option" + (t.id === state.themeId ? " active" : "");
      btn.innerHTML = `<span class="swatch" style="background:${t.accent}; border: 2px solid ${t.bg};"></span><span>${t.name}</span>`;
      btn.onclick = () => {
        state.themeId = t.id;
        document.querySelectorAll(".theme-option").forEach(el => el.classList.remove("active"));
        btn.classList.add("active");
        applyTheme();
        saveState();
      };
      themeGrid.appendChild(btn);
    });

    document.getElementById("fontSizeRange").addEventListener("input", (e) => {
      state.fontSize = Number(e.target.value);
      applyTheme();
      saveState();
    });

    document.getElementById("openSettingsBtn").addEventListener("click", () => document.getElementById("settingsModal").classList.add("open"));
    document.getElementById("closeSettingsModal").addEventListener("click", () => document.getElementById("settingsModal").classList.remove("open"));

    applyTheme();
    selectDhikr(state.selectedId);
  </script>
</body>
</html>
