  <title>عداد التسبيح</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0b1120;
      --surface-color: #131c31;
      --surface-alt: #1a2540;
      --primary-color: #38bdf8;
      --primary-glow: rgba(56, 189, 248, 0.25);
      --accent-color: #fbbf24;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #243252;
      --danger-color: #ef4444;
      --success-color: #10b981;
      --dhikr-font-size: 24px;
      --safe-top: env(safe-area-inset-top, 44px);
      --safe-bottom: env(safe-area-inset-bottom, 34px);
    }

    [data-theme="emerald"] {
      --bg-color: #071913;
      --surface-color: #0d281f;
      --surface-alt: #13362a;
      --primary-color: #10b981;
      --primary-glow: rgba(16, 185, 129, 0.25);
      --accent-color: #fbbf24;
      --text-main: #f0fdf4;
      --text-muted: #86efac;
      --border-color: #1b4939;
    }

    [data-theme="warm"] {
      --bg-color: #1c150e;
      --surface-color: #291f15;
      --surface-alt: #36281b;
      --primary-color: #f59e0b;
      --primary-glow: rgba(245, 158, 11, 0.25);
      --accent-color: #fde68a;
      --text-main: #fffbeb;
      --text-muted: #d6c3a5;
      --border-color: #473524;
    }

    [data-theme="light"] {
      --bg-color: #f4f7f5;
      --surface-color: #ffffff;
      --surface-alt: #eef3f0;
      --primary-color: #0f5132;
      --primary-glow: rgba(15, 81, 50, 0.15);
      --accent-color: #d4af37;
      --text-main: #1b2a22;
      --text-muted: #5c7065;
      --border-color: #dce6e0;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Tajawal', sans-serif;
      overflow: hidden;
    }

    #app {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100dvh;
      padding-top: var(--safe-top);
      padding-bottom: var(--safe-bottom);
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: var(--surface-color);
      border-bottom: 1px solid var(--border-color);
      position: relative;
      z-index: 10;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-title {
      font-size: 18px;
      font-weight: 800;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .save-toast {
      background: rgba(16, 185, 129, 0.18);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.4);
      font-size: 12px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 12px;
      opacity: 0;
      transform: translateY(-4px);
      transition: all 0.25s ease;
      pointer-events: none;
    }

    [data-theme="light"] .save-toast {
      color: #059669;
    }

    .save-toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      background: var(--surface-alt);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      cursor: pointer;
      transition: transform 0.1s;
    }

    .icon-btn:active {
      transform: scale(0.92);
    }

    .tabs-bar {
      display: flex;
      gap: 8px;
      padding: 10px 16px;
      overflow-x: auto;
      background: var(--bg-color);
      border-bottom: 1px solid var(--border-color);
      scrollbar-width: none;
    }
    .tabs-bar::-webkit-scrollbar { display: none; }

    .dhikr-chip {
      flex: 0 0 auto;
      padding: 7px 14px;
      border-radius: 20px;
      background: var(--surface-color);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      font-size: 13.5px;
      font-weight: 700;

      align-items: center;
      gap: 6px;
    }

    .dhikr-chip.active {
      background: var(--primary-color);
      color: #0b1120;
      border-color: var(--primary-color);
    }

    [data-theme="light"] .dhikr-chip.active {
      color: #ffffff;
    }

    .progress-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: var(--accent-color);
      display: inline-block;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 14px 16px;
      overflow-y: auto;
    }

    .card {
      background: var(--surface-color);
      border-radius: 22px;
      padding: 16px 18px;
      border: 1px solid var(--border-color);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .step-badge {
      background: var(--surface-alt);
      color: var(--primary-color);
      border: 1px solid var(--border-color);
      font-size: 12.5px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 12px;
    }

    .dhikr-text {
      font-family: 'Amiri', serif;
      font-size: var(--dhikr-font-size);
      line-height: 1.75;
      text-align: center;
      color: var(--text-main);
      margin: 12px 0;
      font-weight: 700;
    }

    .virtue-box {
      background: var(--surface-alt);
      border-radius: 14px;
      padding: 10px 14px;
      font-size: 13px;
      line-height: 1.6;
      color: var(--text-muted);
      border-right: 3px solid var(--accent-color);
    }

    .counter-zone {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 12px 0;
      cursor: pointer;
    }

    .counter-ring {
      width: 215px;
      height: 215px;
      border-radius: 50%;
      background: var(--surface-color);
      border: 6px solid var(--primary-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 32px var(--primary-glow);
      transition: transform 0.08s ease;
    }

    .counter-ring:active {
      transform: scale(0.95);
    }

    .count-number {
      font-size: 56px;
      font-weight: 800;
      color: var(--primary-color);
      line-height: 1;
    }

    .count-label {
      font-size: 14px;
      color: var(--text-muted);
      margin-top: 8px;
      font-weight: 700;
    }

    .bottom-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .ctrl-btn {
      flex: 1;
      padding: 13px 10px;
      border-radius: 14px;
      border: 1px solid var(--border-color);
      background: var(--surface-color);
      color: var(--text-main);
      font-family: 'Tajawal', sans-serif;
      font-size: 14.5px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .ctrl-btn.primary {
      background: var(--primary-color);
      color: #0b1120;
      border-color: var(--primary-color);
    }

    [data-theme="light"] .ctrl-btn.primary {
      color: #ffffff;
    }

    /* Modals */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.68);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-box {
      background: var(--surface-color);
      border: 1px solid var(--border-color);
      width: 100%;
      max-width: 410px;
      max-height: 85dvh;
      border-radius: 22px;
      padding: 18px;
      overflow-y: auto;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-color);
    }

    .modal-title {
      font-size: 17px;
      font-weight: 800;
      margin: 0;
      color: var(--primary-color);
    }

    .close-btn {
      background: var(--surface-alt);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      width: 32px;
      height: 32px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 13.5px;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--text-main);
    }

    input[type="text"], input[type="number"], textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      background: var(--bg-color);
      color: var(--text-main);
      font-family: 'Tajawal', sans-serif;
      font-size: 14.5px;
      user-select: text;
    }

    .step-item-edit {
      background: var(--surface-alt);
      padding: 10px;
      border-radius: 12px;
      margin-bottom: 8px;
      border: 1px solid var(--border-color);
    }

    .step-row {
      display: flex;
      gap: 8px;
      margin-top: 6px;
      align-items: center;
    }

    .manage-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--surface-alt);
      padding: 10px 12px;
      border-radius: 14px;
      margin-bottom: 8px;
      border: 1px solid var(--border-color);
      gap: 8px;
    }

    .manage-item-info {
      flex: 1;
      overflow: hidden;
    }

    .manage-item-title {
      font-size: 14.5px;
      font-weight: 700;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .manage-item-sub {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .manage-actions {
      display: flex;
      gap: 6px;
    }

    .small-btn {
      background: var(--surface-color);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      border-radius: 9px;
      padding: 6px 10px;
      font-size: 12.5px;
      font-family: 'Tajawal', sans-serif;
      font-weight: 700;

    }

    .small-btn.danger {
      color: var(--danger-color);
      border-color: rgba(239, 68, 68, 0.35);
    }

    .theme-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }

    .theme-option {
      padding: 10px 8px;
      border-radius: 12px;
      border: 2px solid var(--border-color);
      background: var(--surface-alt);
      text-align: center;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
    }

    .theme-option.selected {
      border-color: var(--primary-color);
      color: var(--primary-color);
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <div class="header-right">
        <div class="header-title">📿 عداد التسبيح</div>
        <span class="save-toast" id="saveToast">تم الحفظ</span>
      </div>
      <div class="header-actions">
        <button class="icon-btn" onclick="openAddModal()" title="إضافة ذكر جديد">➕</button>
        <button class="icon-btn" onclick="openManageModal()" title="إدارة وتعديل الأذكار">📝</button>
        <button class="icon-btn" onclick="openSettingsModal()" title="المظهر والإعدادات">⚙</button>
      </div>
    </header>

    <div class="tabs-bar" id="tabsBar"></div>

    <main>
      <div class="card">
        <div class="card-top">
          <span class="step-badge" id="stepBadge">الخطوة 1 من 1</span>
        </div>
        <div class="dhikr-text" id="dhikrText"></div>
        <div class="virtue-box" id="virtueBox"></div>
      </div>

      <div class="counter-zone" onclick="handleTap()">
        <div class="counter-ring" id="counterRing">
          <div class="count-number" id="countDisplay">100</div>
          <div class="count-label" id="countLabel">المتبقي</div>
        </div>
      </div>

      <div class="bottom-controls">
        <button class="ctrl-btn" onclick="resetCurrent()">🔄 تصفير العداد</button>
        <button class="ctrl-btn primary" onclick="nextStepOrDhikr()">⏭ الخطوة التالية</button>
      </div>
    </main>
  </div>

  <!-- Add / Edit Modal -->
  <div class="modal-backdrop" id="formModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3 class="modal-title" id="formModalTitle">إضافة ذكر جديد</h3>
        <button class="close-btn" onclick="closeModal('formModal')">✕</button>
      </div>
      <div class="form-group">
        <label>عنوان الذكر في القائمة</label>
        <input type="text" id="inputTitle" placeholder="مثال: أذكار الصباح">
      </div>
      <div class="form-group">
        <label>فضل الذكر (اختياري)</label>
        <textarea id="inputVirtue" rows="2" placeholder="اكتب فضل الذكر أو الحديث..."></textarea>
      </div>
      <div class="form-group">
        <label>خطوات التسبيح (اجعل العدد 0 للعد المفتوح)</label>
        <div id="stepsContainer"></div>
        <button type="button" class="small-btn" style="width: 100%; margin-top: 6px; padding: 8px;" onclick="addStepField()">+ إضافة خطوة</button>
      </div>
      <div class="modal-actions">
        <button class="ctrl-btn primary" onclick="saveDhikrForm()">💾 حفظ الذكر</button>
      </div>
    </div>
  </div>

  <!-- Manage Adhkar Modal -->
  <div class="modal-backdrop" id="manageModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3 class="modal-title">إدارة وتعديل الأذكار</h3>
        <button class="close-btn" onclick="closeModal('manageModal')">✕</button>
      </div>
      <div id="manageList"></div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div class="modal-backdrop" id="settingsModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3 class="modal-title">المظهر والإعدادات</h3>
        <button class="close-btn" onclick="closeModal('settingsModal')">✕</button>
      </div>
      <div class="form-group">
        <label>ألوان التطبيق</label>
        <div class="theme-grid">
          <div class="theme-option" data-t="default" onclick="setTheme('default')">🌌 كحلي ليلي</div>
          <div class="theme-option" data-t="emerald" onclick="setTheme('emerald')">🌿 أخضر زمردي</div>
          <div class="theme-option" data-t="warm" onclick="setTheme('warm')">✨ ذهبي دافئ</div>
          <div class="theme-option" data-t="light" onclick="setTheme('light')">☀ نهاري فاتح</div>
        </div>
      </div>
      <div class="form-group">
        <label>حجم خط نص التسبيح (<span id="fontSizeVal">24</span> px)</label>
        <input type="range" id="fontSlider" min="18" max="40" value="24" style="width: 100%;" oninput="setFontSize(this.value)">
      </div>
      <div class="modal-actions" style="flex-direction: column;">
        <button class="ctrl-btn" style="color: var(--danger-color); border-color: rgba(239, 68, 68, 0.35);" onclick="openResetDefaultsConfirm()">⚠ استعادة الأذكار الافتراضية</button>
      </div>
    </div>
  </div>

  <!-- Delete Confirmation Modal -->
  <div class="modal-backdrop" id="deleteModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3 class="modal-title" style="color: var(--danger-color);">تأكيد الحذف</h3>
        <button class="close-btn" onclick="closeModal('deleteModal')">✕</button>
      </div>
      <p id="deleteMsg" style="font-size: 15px; line-height: 1.6; margin-bottom: 18px;">هل أنت متأكد من حذف هذا الذكر؟</p>
      <div class="modal-actions">
        <button class="ctrl-btn" onclick="closeModal('deleteModal')">إلغاء</button>
        <button class="ctrl-btn" style="background: var(--danger-color); color: #fff; border: none;" onclick="confirmDeleteAction()">نعم، احذف</button>
      </div>
    </div>
  </div>

  <script>
    const defaultAdhkar = [
      {
        id: 'd1',
        title: 'سبحان الله وبحمده',
        virtue: 'من قالها في يوم مائة مرة حطت خطاياه وإن كانت مثل زبد البحر.',
        steps: [{ text: 'سُبْحَانَ اللَّهِ وَبِحَمْدِهِ', target: 100 }]
      },
      {
        id: 'd2',
        title: 'التهليل (100 مرة)',
        virtue: 'كانت له عدل عشر رقاب، وكتبت له مائة حسنة، ومحيت عنه مائة سيئة، وكانت له حرزاً من الشيطان.',
        steps: [{ text: 'لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ', target: 100 }]
      },
      {
        id: 'd3',
        title: 'التسبيح دبر الصلاة',
        virtue: 'من سبّح الله دبر كل صلاة ثلاثاً وثلاثين، وحمد الله ثلاثاً وثلاثين، وكبّر الله ثلاثاً وثلاثين، وختم المائة بالتهليل غُفرت خطاياه.',
        steps: [
          { text: 'سُبْحَانَ اللَّهِ', target: 33 },
          { text: 'الْحَمْدُ لِلَّهِ', target: 33 },
          { text: 'اللَّهُ أَكْبَرُ', target: 33 },
          { text: 'لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ', target: 1 }
        ]
      },
      {
        id: 'd4',
        title: 'التسبيح عند النوم',
        virtue: 'وصية النبي ﷺ لفاطمة وعلي رضي الله عنهما عند أخذ المضجع، وهي خير من خادم.',
        steps: [
          { text: 'سُبْحَانَ اللَّهِ', target: 33 },
          { text: 'الْحَمْدُ لِلَّهِ', target: 33 },
          { text: 'اللَّهُ أَكْبَرُ', target: 34 }
        ]
      },
      {
        id: 'd5',
        title: 'عدد خلقه (3 مرات)',
        virtue: 'أربع كلمات إذا قيلت ثلاث مرات وزنت ما قيل من الذكر منذ الصباح.',
        steps: [{ text: 'سُبْحَانَ اللَّهِ وَبِحَمْدِهِ، عَدَدَ خَلْقِهِ، وَرِضَا نَفْسِهِ، وَزِنَةَ عَرْشِهِ، وَمِدَادَ كَلِمَاتِهِ', target: 3 }]
      },
      {
        id: 'd6',
        title: 'الباقيات الصالحات',
        virtue: 'أحب الكلام إلى الله أربع، لا يضرك بأيهن بدأت.',
        steps: [{ text: 'سُبْحَانَ اللَّهِ، وَالْحَمْدُ لِلَّهِ، وَلَا إِلَهَ إِلَّا اللَّهُ، وَاللَّهُ أَكْبَرُ', target: 0 }]
      },
      {
        id: 'd7',
        title: 'كلمتان خفيفتان',
        virtue: 'كلمتان خفيفتان على اللسان، ثقيلتان في الميزان، حبيبتان إلى الرحمن.',
        steps: [{ text: 'سُبْحَانَ اللَّهِ وَبِحَمْدِهِ، سُبْحَانَ اللَّهِ الْعَظِيمِ', target: 0 }]
      },
      {
        id: 'd8',
        title: 'الحوقلة',
        virtue: 'كنز من كنوز الجنة.',
        steps: [{ text: 'لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ', target: 0 }]
      }
    ];

    let state = {
      adhkar: JSON.parse(localStorage.getItem('tasbih_adhkar_v6')) || JSON.parse(JSON.stringify(defaultAdhkar)),
      activeIndex: parseInt(localStorage.getItem('tasbih_active_idx_v6') || '0', 10),
      progressMap: JSON.parse(localStorage.getItem('tasbih_progress_map_v6') || '{}'),
      theme: localStorage.getItem('tasbih_theme_v6') || 'default',
      fontSize: parseInt(localStorage.getItem('tasbih_fontsize_v6') || '24', 10),
      editingIndex: null,
      pendingAction: null,
      pendingIndex: null
    };

    let toastTimer = null;
    function showSavedToast() {
      const toast = document.getElementById('saveToast');
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 1400);
    }

    function saveState(notify = false) {
      localStorage.setItem('tasbih_adhkar_v6', JSON.stringify(state.adhkar));
      localStorage.setItem('tasbih_active_idx_v6', state.activeIndex);
      localStorage.setItem('tasbih_progress_map_v6', JSON.stringify(state.progressMap));
      localStorage.setItem('tasbih_theme_v6', state.theme);
      localStorage.setItem('tasbih_fontsize_v6', state.fontSize);
      if (notify) showSavedToast();
    }

    function getDhikrProgress(dhikr) {
      let prog = state.progressMap[dhikr.id];
      if (!prog || prog.stepIndex >= dhikr.steps.length) {
        const firstTarget = dhikr.steps[0].target;
        prog = {
          stepIndex: 0,
          count: firstTarget > 0 ? firstTarget : 0
        };
        state.progressMap[dhikr.id] = prog;
      }
      return prog;
    }

    function hasActiveProgress(dhikr) {
      const prog = state.progressMap[dhikr.id];
      if (!prog) return false;
      const firstTarget = dhikr.steps[0].target;
      if (prog.stepIndex > 0) return true;
      if (firstTarget > 0 && prog.count < firstTarget) return true;
      if (firstTarget === 0 && prog.count > 0) return true;
      return false;
    }

    function init() {
      if (state.activeIndex >= state.adhkar.length) state.activeIndex = 0;
      applyAppearance();
      render();
    }

    function getCurrentDhikr() {
      return state.adhkar[state.activeIndex];
    }

    function applyAppearance() {
      if (state.theme === 'default') {
        document.documentElement.removeAttribute('data-theme');
      } else {
        document.documentElement.setAttribute('data-theme', state.theme);
      }
      document.documentElement.style.setProperty('--dhikr-font-size', state.fontSize + 'px');
      document.getElementById('fontSlider').value = state.fontSize;
      document.getElementById('fontSizeVal').textContent = state.fontSize;
      document.querySelectorAll('.theme-option').forEach(el => {
        el.classList.toggle('selected', el.dataset.t === state.theme);
      });
    }

    function render() {
      const tabsBar = document.getElementById('tabsBar');
      tabsBar.innerHTML = '';
      state.adhkar.forEach((item, idx) => {
        const chip = document.createElement('button');
        chip.className = 'dhikr-chip' + (idx === state.activeIndex ? ' active' : '');
        const dotHtml = hasActiveProgress(item) ? '<span class="progress-dot"></span>' : '';
        chip.innerHTML = `${dotHtml}<span>${item.title}</span>`;
        chip.onclick = () => selectDhikr(idx);
        tabsBar.appendChild(chip);
      });

      const dhikr = getCurrentDhikr();
      const prog = getDhikrProgress(dhikr);
      const step = dhikr.steps[prog.stepIndex];

      document.getElementById('stepBadge').textContent = `الخطوة ${prog.stepIndex + 1} من ${dhikr.steps.length}`;
      document.getElementById('dhikrText').textContent = step.text;

      const virtueBox = document.getElementById('virtueBox');
      if (dhikr.virtue && dhikr.virtue.trim() !== '') {
        virtueBox.style.display = 'block';
        virtueBox.textContent = dhikr.virtue;
      } else {
        virtueBox.style.display = 'none';
      }

      document.getElementById('countDisplay').textContent = prog.count;
      document.getElementById('countLabel').textContent = step.target > 0 ? 'المتبقي' : 'العدد الحالي';
      saveState(false);
    }

    function selectDhikr(index) {
      state.activeIndex = index;
      render();
    }

    function handleTap() {
      if (navigator.vibrate) navigator.vibrate(25);
      const dhikr = getCurrentDhikr();
      const prog = getDhikrProgress(dhikr);
      const step = dhikr.steps[prog.stepIndex];

      if (step.target > 0) {
        if (prog.count > 1) {
          prog.count--;
        } else {
          if (navigator.vibrate) navigator.vibrate([40, 40, 40]);
          if (prog.stepIndex < dhikr.steps.length - 1) {
            prog.stepIndex++;
            const nextS = dhikr.steps[prog.stepIndex];
            prog.count = nextS.target > 0 ? nextS.target : 0;
          } else {
            prog.stepIndex = 0;
            const firstS = dhikr.steps[0];
            prog.count = firstS.target > 0 ? firstS.target : 0;
          }
        }
      } else {
        prog.count++;
      }
      state.progressMap[dhikr.id] = prog;
      render();
    }

    function resetCurrent() {
      const dhikr = getCurrentDhikr();
      const prog = getDhikrProgress(dhikr);
      const step = dhikr.steps[prog.stepIndex];
      prog.count = step.target > 0 ? step.target : 0;
      state.progressMap[dhikr.id] = prog;
      render();
      showSavedToast();
    }

    function nextStepOrDhikr() {
      const dhikr = getCurrentDhikr();
      const prog = getDhikrProgress(dhikr);
      if (prog.stepIndex < dhikr.steps.length - 1) {
        prog.stepIndex++;
        const nextS = dhikr.steps[prog.stepIndex];
        prog.count = nextS.target > 0 ? nextS.target : 0;
        state.progressMap[dhikr.id] = prog;
      } else {
        state.activeIndex = (state.activeIndex + 1) % state.adhkar.length;
      }
      render();
    }

    /* Add & Edit */
    function openAddModal() {
      state.editingIndex = null;
      document.getElementById('formModalTitle').textContent = 'إضافة ذكر جديد';
      document.getElementById('inputTitle').value = '';
      document.getElementById('inputVirtue').value = '';
      const container = document.getElementById('stepsContainer');
      container.innerHTML = '';
      addStepField('', 33);
      document.getElementById('formModal').classList.add('open');
    }

    function openEditModalByIndex(idx) {
      closeModal('manageModal');
      state.editingIndex = idx;
      const dhikr = state.adhkar[idx];
      document.getElementById('formModalTitle').textContent = 'تعديل الذكر';
      document.getElementById('inputTitle').value = dhikr.title;
      document.getElementById('inputVirtue').value = dhikr.virtue || '';
      const container = document.getElementById('stepsContainer');
      container.innerHTML = '';
      dhikr.steps.forEach(s => addStepField(s.text, s.target));
      document.getElementById('formModal').classList.add('open');
    }

    function addStepField(text = '', target = 33) {
      const container = document.getElementById('stepsContainer');
      const div = document.createElement('div');
      div.className = 'step-item-edit';
      div.innerHTML = `
        <textarea rows="2" placeholder="نص الذكر في هذه الخطوة..." class="step-text-input">${text}</textarea>
        <div class="step-row">
          <span style="font-size: 13px; font-weight: 700;">العدد:</span>
          <input type="number" min="0" value="${target}" class="step-target-input" style="width: 90px;">
          <button type="button" class="small-btn danger" onclick="removeStepField(this)">حذف</button>
        </div>
      `;
      container.appendChild(div);
    }

    function removeStepField(btn) {
      const container = document.getElementById('stepsContainer');
      if (container.children.length > 1) {
        btn.closest('.step-item-edit').remove();
      }
    }

    function saveDhikrForm() {
      const title = document.getElementById('inputTitle').value.trim();
      const virtue = document.getElementById('inputVirtue').value.trim();
      const stepEls = document.querySelectorAll('.step-item-edit');
      const steps = [];

      stepEls.forEach(el => {
        const txt = el.querySelector('.step-text-input').value.trim();
        const tgt = parseInt(el.querySelector('.step-target-input').value || '0', 10);
        if (txt) {
          steps.push({ text: txt, target: isNaN(tgt) || tgt < 0 ? 0 : tgt });
        }
      });

      if (!title || steps.length === 0) return;

      if (state.editingIndex !== null) {
        const currentId = state.adhkar[state.editingIndex].id;
        state.adhkar[state.editingIndex] = {
          id: currentId,
          title,
          virtue,
          steps
        };
        delete state.progressMap[currentId];
        state.activeIndex = state.editingIndex;
      } else {
        const newId = 'custom_' + Date.now();
        state.adhkar.push({
          id: newId,
          title,
          virtue,
          steps
        });
        state.activeIndex = state.adhkar.length - 1;
      }

      closeModal('formModal');
      render();
      showSavedToast();
    }

    /* Manage List */
    function openManageModal() {
      const list = document.getElementById('manageList');
      list.innerHTML = '';
      state.adhkar.forEach((item, idx) => {
        const row = document.createElement('div');
        row.className = 'manage-item';
        const deleteBtnHtml = state.adhkar.length > 1
          ? `<button class="small-btn danger" onclick="openDeleteDhikrConfirm(${idx})">حذف</button>`
          : '';
        row.innerHTML = `
          <div class="manage-item-info">
            <div class="manage-item-title">${item.title}</div>
            <div class="manage-item-sub">${item.steps.length} خطوات</div>
          </div>
          <div class="manage-actions">
            <button class="small-btn" onclick="openEditModalByIndex(${idx})">تعديل</button>
            ${deleteBtnHtml}
          </div>
        `;
        list.appendChild(row);
      });
      document.getElementById('manageModal').classList.add('open');
    }

    function openDeleteDhikrConfirm(idx) {
      closeModal('manageModal');
      state.pendingAction = 'deleteDhikr';
      state.pendingIndex = idx;
      document.getElementById('deleteMsg').textContent = `هل أنت متأكد من حذف "${state.adhkar[idx].title}"؟`;
      document.getElementById('deleteModal').classList.add('open');
    }

    function openResetDefaultsConfirm() {
      closeModal('settingsModal');
      state.pendingAction = 'resetDefaults';
      document.getElementById('deleteMsg').textContent = 'هل أنت متأكد من استعادة الأذكار الافتراضية وحذف الأذكار المضافة؟';
      document.getElementById('deleteModal').classList.add('open');
    }

    function confirmDeleteAction() {
      if (state.pendingAction === 'deleteDhikr' && state.pendingIndex !== null) {
        if (state.adhkar.length > 1) {
          const removedId = state.adhkar[state.pendingIndex].id;
          delete state.progressMap[removedId];
          state.adhkar.splice(state.pendingIndex, 1);
          if (state.activeIndex >= state.adhkar.length) {
            state.activeIndex = state.adhkar.length - 1;
          }
        }
      } else if (state.pendingAction === 'resetDefaults') {
        state.adhkar = JSON.parse(JSON.stringify(defaultAdhkar));
        state.progressMap = {};
        state.activeIndex = 0;
      }
      state.pendingAction = null;
      state.pendingIndex = null;
      closeModal('deleteModal');
      render();
      showSavedToast();
    }

    /* Settings */
    function openSettingsModal() {
      document.getElementById('settingsModal').classList.add('open');
    }

    function setTheme(themeName) {
      state.theme = themeName;
      applyAppearance();
      saveState(true);
    }

    function setFontSize(val) {
      state.fontSize = parseInt(val, 10);
      applyAppearance();
      saveState(true);
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('open');
    }

    init();
  </script>
</body>
</html>
