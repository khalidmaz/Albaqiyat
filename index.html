<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="عداد التسبيح" />
  <title>عداد التسبيح</title>
  <style>
    :root {
      --bg-color: #0b131e;
      --surface-color: #132030;
      --surface-elevated: #1a2b40;
      --primary-color: #10b981;
      --primary-glow: rgba(16, 185, 129, 0.25);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.08);
      --danger-color: #ef4444;
      --dhikr-font-size: 24px;
    }

    [data-theme="emerald"] {
      --bg-color: #071915;
      --surface-color: #0d2b24;
      --surface-elevated: #133c32;
      --primary-color: #34d399;
      --primary-glow: rgba(52, 211, 153, 0.25);
      --text-main: #ecfdf5;
      --text-muted: #a7f3d0;
    }

    [data-theme="gold"] {
      --bg-color: #1a140b;
      --surface-color: #292013;
      --surface-elevated: #382c1a;
      --primary-color: #f59e0b;
      --primary-glow: rgba(245, 158, 11, 0.25);
      --text-main: #fffbeb;
      --text-muted: #fde68a;
    }

    [data-theme="light"] {
      --bg-color: #f1f5f9;
      --surface-color: #ffffff;
      --surface-elevated: #e2e8f0;
      --primary-color: #059669;
      --primary-glow: rgba(5, 150, 105, 0.2);
      --text-main: #0f172a;
      --text-muted: #475569;
      --border-color: rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Arabic", "Segoe UI", Tahoma, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
      background: var(--surface-color);
      z-index: 10;
    }

    .header-title {
      font-size: 18px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      background: var(--surface-elevated);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
    }

    .icon-btn:active {
      transform: scale(0.94);
    }

    .dhikr-selector-bar {
      padding: 10px 16px;
      background: var(--bg-color);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .dhikr-dropdown {
      flex: 1;
      background: var(--surface-color);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      outline: none;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
      overflow-y: auto;
      gap: 14px;
    }

    .dhikr-card {
      background: var(--surface-color);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
    }

    .step-indicator {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: var(--primary-color);
      font-weight: 600;
    }

    .steps-dots {
      display: flex;
      gap: 6px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--surface-elevated);
    }

    .dot.active {
      background: var(--primary-color);
      width: 20px;
      border-radius: 4px;
    }

    .dhikr-text {
      font-size: var(--dhikr-font-size);
      line-height: 1.65;
      font-weight: 700;
      text-align: center;
      padding: 8px 0;
      word-wrap: break-word;
    }

    .dhikr-virtue {
      font-size: 13px;
      line-height: 1.5;
      color: var(--text-muted);
      background: var(--surface-elevated);
      padding: 10px 12px;
      border-radius: 12px;
      text-align: center;
    }

    .counter-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 220px;
    }

    .tap-circle {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: radial-gradient(circle at center, var(--surface-elevated), var(--surface-color));
      border: 4px solid var(--primary-color);
      box-shadow: 0 0 35px var(--primary-glow);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      transition: transform 0.08s ease;
    }

    .tap-circle:active {
      transform: scale(0.95);
    }

    .count-number {
      font-size: 56px;
      font-weight: 800;
      color: var(--text-main);
      font-variant-numeric: tabular-nums;
      line-height: 1.1;
    }

    .count-label {
      font-size: 14px;
      color: var(--text-muted);
      margin-top: 4px;
      font-weight: 600;
    }

    .bottom-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .btn {
      flex: 1;
      padding: 12px;
      border-radius: 14px;
      border: 1px solid var(--border-color);
      background: var(--surface-color);
      color: var(--text-main);
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background: var(--primary-color);
      color: #051b11;
      border: none;
      font-weight: 700;
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.15);
      color: var(--danger-color);
      border-color: rgba(239, 68, 68, 0.3);
    }

    /* Modals */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(6px);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 100;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-sheet {
      background: var(--surface-color);
      width: 100%;
      max-height: 88dvh;
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      padding: 20px 16px calc(20px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
      border-top: 1px solid var(--border-color);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-color);
    }

    .modal-title {
      font-size: 18px;
      font-weight: 700;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-label {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .form-input, .form-textarea {
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 12px;
      border-radius: 12px;
      font-size: 15px;
      font-family: inherit;
      outline: none;
      width: 100%;
    }

    .form-textarea {
      resize: vertical;
      min-height: 70px;
    }

    .step-item-edit {
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      padding: 12px;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .step-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 700;
      color: var(--primary-color);
    }

    .manage-list-item {
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      padding: 12px;
      border-radius: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .manage-item-info {
      flex: 1;
      overflow: hidden;
    }

    .manage-item-title {
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .manage-item-sub {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .manage-item-actions {
      display: flex;
      gap: 6px;
    }

    .small-btn {
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background: var(--surface-elevated);
      color: var(--text-main);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .small-btn.delete {
      background: rgba(239, 68, 68, 0.15);
      color: var(--danger-color);
      border-color: rgba(239, 68, 68, 0.3);
    }

    .theme-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .theme-option {
      padding: 12px;
      border-radius: 12px;
      border: 2px solid var(--border-color);
      background: var(--bg-color);
      color: var(--text-main);
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      text-align: center;
    }

    .theme-option.active {
      border-color: var(--primary-color);
      background: var(--surface-elevated);
    }

    /* Confirm Dialog inside app */
    .confirm-box {
      background: var(--surface-color);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 20px;
      width: 90%;
      max-width: 340px;
      margin: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
      text-align: center;
    }

    .toast {
      position: fixed;
      top: calc(16px + env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: var(--primary-color);
      color: #051b11;
      padding: 10px 20px;
      border-radius: 99px;
      font-weight: 700;
      font-size: 14px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.3);
      transition: transform 0.3s ease;
      z-index: 200;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <div id="toast" class="toast">تم الحفظ</div>

  <header>
    <div class="header-title">📿 عداد التسبيح</div>
    <div class="header-actions">
      <button class="icon-btn" onclick="openAddModal()" title="إضافة ذكر">➕</button>
      <button class="icon-btn" onclick="openManageModal()" title="إدارة الأذكار">📝</button>
      <button class="icon-btn" onclick="openSettingsModal()" title="الإعدادات">⚙️</button>
    </div>
  </header>

  <div class="dhikr-selector-bar">
    <select id="dhikrSelect" class="dhikr-dropdown" onchange="selectDhikr(this.value)"></select>
  </div>

  <main>
    <div class="dhikr-card">
      <div class="step-indicator" id="stepHeader" style="display: none;">
        <span id="stepTitle">الخطوة 1 من 4</span>
        <div class="steps-dots" id="stepsDots"></div>
      </div>
      <div class="dhikr-text" id="dhikrText">سبحان الله وبحمده</div>
      <div class="dhikr-virtue" id="dhikrVirtue">من قالها في يوم مائة مرة حطت خطاياه وإن كانت مثل زبد البحر.</div>
    </div>

    <div class="counter-area">
      <button class="tap-circle" id="tapBtn" onclick="handleTap()">
        <span class="count-number" id="countDisplay">100</span>
        <span class="count-label" id="countModeLabel">المتبقي</span>
      </button>
    </div>

    <div class="bottom-controls">
      <button class="btn" onclick="resetCurrent()">🔄 تصفير العداد</button>
      <button class="btn" id="nextStepBtn" onclick="nextStepManual()" style="display: none;">⏭️ الخطوة التالية</button>
    </div>
  </main>

  <!-- Modal: Add / Edit Dhikr -->
  <div class="modal-overlay" id="editModal">
    <div class="modal-sheet">
      <div class="modal-header">
        <span class="modal-title" id="editModalTitle">إضافة ذكر جديد</span>
        <button class="icon-btn" onclick="closeModal('editModal')">✕</button>
      </div>

      <input type="hidden" id="editDhikrId" />

      <div class="form-group">
        <label class="form-label">عنوان الذكر في القائمة</label>
        <input type="text" id="dhikrNameInput" class="form-input" placeholder="مثال: أذكار الصباح" />
      </div>

      <div class="form-group">
        <label class="form-label">فضل الذكر (اختياري)</label>
        <input type="text" id="dhikrVirtueInput" class="form-input" placeholder="اكتب فضل الذكر هنا..." />
      </div>

      <div class="form-group">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <label class="form-label">خطوات التسبيح (اجعل العدد 0 للعد المفتوح)</label>
          <button type="button" class="small-btn" onclick="addStepField()">+ إضافة خطوة</button>
        </div>
        <div id="stepsContainer" style="display:flex; flex-direction:column; gap:10px; margin-top:6px;"></div>
      </div>

      <button class="btn btn-primary" onclick="saveDhikrForm()" style="margin-top:8px; padding:14px;">💾 حفظ الذكر</button>
    </div>
  </div>

  <!-- Modal: Manage Adhkar (Edit / Delete) -->
  <div class="modal-overlay" id="manageModal">
    <div class="modal-sheet">
      <div class="modal-header">
        <span class="modal-title">إدارة وتعديل الأذكار</span>
        <button class="icon-btn" onclick="closeModal('manageModal')">✕</button>
      </div>
      <div id="manageListContainer" style="display:flex; flex-direction:column; gap:10px;"></div>
    </div>
  </div>

  <!-- Modal: Settings -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal-sheet">
      <div class="modal-header">
        <span class="modal-title">المظهر والإعدادات</span>
        <button class="icon-btn" onclick="closeModal('settingsModal')">✕</button>
      </div>

      <div class="form-group">
        <label class="form-label">ألوان التطبيق</label>
        <div class="theme-grid">
          <button class="theme-option" data-set-theme="default" onclick="setTheme('default')">🌌 كحلي ليلي</button>
          <button class="theme-option" data-set-theme="emerald" onclick="setTheme('emerald')">🌿 أخضر زمردي</button>
          <button class="theme-option" data-set-theme="gold" onclick="setTheme('gold')">✨ ذهبي دافئ</button>
          <button class="theme-option" data-set-theme="light" onclick="setTheme('light')">☀️ نهاري فاتح</button>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">حجم خط نص التسبيح (<span id="fontSizeVal">24</span>px)</label>
        <input type="range" id="fontSizeSlider" min="18" max="38" value="24" oninput="setFontSize(this.value)" style="width:100%; accent-color: var(--primary-color);" />
      </div>

      <button class="btn btn-danger" onclick="confirmResetAllData()" style="margin-top:10px;">⚠️ استعادة الأذكار الافتراضية</button>
    </div>
  </div>

  <!-- Custom In-App Confirm Dialog (Fixes iOS Safari/WebView confirm block) -->
  <div class="modal-overlay" id="confirmModal" style="align-items: center;">
    <div class="confirm-box">
      <div style="font-size: 18px; font-weight: 700;" id="confirmTitle">تأكيد الحذف</div>
      <div style="font-size: 14px; color: var(--text-muted);" id="confirmMessage">هل أنت متأكد من حذف هذا الذكر؟</div>
      <div style="display: flex; gap: 10px; margin-top: 6px;">
        <button class="btn" onclick="closeModal('confirmModal')">إلغاء</button>
        <button class="btn btn-danger" id="confirmActionBtn">نعم، احذف</button>
      </div>
    </div>
  </div>

  <script>
    const DEFAULT_ADHKAR = [
      {
        id: 'd1',
        name: 'سبحان الله وبحمده (100)',
        virtue: 'قال ﷺ: «من قال سبحان الله وبحمده في يوم مائة مرة حطت خطاياه وإن كانت مثل زبد البحر».',
        steps: [{ text: 'سبحان الله وبحمده', target: 100 }]
      },
      {
        id: 'd2',
        name: 'التهليل المضاعف (100)',
        virtue: 'كانت له عدل عشر رقاب، وكتبت له مائة حسنة، ومحيت عنه مائة سيئة، وكانت له حرزاً من الشيطان.',
        steps: [{ text: 'لا إله إلا الله وحده لا شريك له، له الملك وله الحمد وهو على كل شيء قدير', target: 100 }]
      },
      {
        id: 'd3',
        name: 'التسبيح دبر كل صلاة',
        virtue: 'غُفرت خطاياه وإن كانت مثل زبد البحر.',
        steps: [
          { text: 'سبحان الله', target: 33 },
          { text: 'الحمد لله', target: 33 },
          { text: 'الله أكبر', target: 33 },
          { text: 'لا إله إلا الله وحده لا شريك له، له الملك وله الحمد وهو على كل شيء قدير', target: 1 }
        ]
      },
      {
        id: 'd4',
        name: 'التسبيح عند النوم',
        virtue: 'أوصى به النبي ﷺ ابنته فاطمة وعلياً رضي الله عنهما، وهو خير من خادم.',
        steps: [
          { text: 'سبحان الله', target: 33 },
          { text: 'الحمد لله', target: 33 },
          { text: 'الله أكبر', target: 34 }
        ]
      },
      {
        id: 'd5',
        name: 'التسبيح المضاعف (3 مرات)',
        virtue: 'يعدل ساعات طويلة من الذكر المتواصل.',
        steps: [{ text: 'سبحان الله وبحمده، عدد خلقه، ورضا نفسه، وزنة عرشه، ومداد كلماته', target: 3 }]
      },
      {
        id: 'd6',
        name: 'الباقيات الصالحات (مفتوح)',
        virtue: 'أحب الكلام إلى الله، ولا يضرك بأيهن بدأت.',
        steps: [{ text: 'سبحان الله، والحمد لله، ولا إله إلا الله، والله أكبر', target: 0 }]
      },
      {
        id: 'd7',
        name: 'كلمتان خفيفتان (مفتوح)',
        virtue: 'كلمتان خفيفتان على اللسان، ثقيلتان في الميزان، حبيبتان إلى الرحمن.',
        steps: [{ text: 'سبحان الله وبحمده، سبحان الله العظيم', target: 0 }]
      },
      {
        id: 'd8',
        name: 'كنز من كنوز الجنة (مفتوح)',
        virtue: 'قال ﷺ: «ألا أدلك على كنز من كنوز الجنة؟ لا حول ولا قوة إلا بالله».',
        steps: [{ text: 'لا حول ولا قوة إلا بالله', target: 0 }]
      }
    ];

    let state = {
      adhkar: [],
      currentId: 'd1',
      currentStepIndex: 0,
      remaining: 100,
      theme: 'default',
      fontSize: 24
    };

    function loadState() {
      try {
        const saved = localStorage.getItem('tasbih_app_v2');
        if (saved) {
          const parsed = JSON.parse(saved);
          if (parsed && Array.isArray(parsed.adhkar) && parsed.adhkar.length > 0) {
            state = { ...state, ...parsed };
          } else {
            state.adhkar = JSON.parse(JSON.stringify(DEFAULT_ADHKAR));
          }
        } else {
          state.adhkar = JSON.parse(JSON.stringify(DEFAULT_ADHKAR));
        }
      } catch (e) {
        state.adhkar = JSON.parse(JSON.stringify(DEFAULT_ADHKAR));
      }

      if (!state.adhkar.find(d => d.id === state.currentId)) {
        state.currentId = state.adhkar[0].id;
        state.currentStepIndex = 0;
        const firstTarget = state.adhkar[0].steps[0].target;
        state.remaining = firstTarget > 0 ? firstTarget : 0;
      }

      applyTheme(state.theme);
      applyFontSize(state.fontSize);
      renderAll();
    }

    function saveState() {
      try {
        localStorage.setItem('tasbih_app_v2', JSON.stringify(state));
      } catch (e) {}
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2000);
    }

    function getCurrentDhikr() {
      return state.adhkar.find(d => d.id === state.currentId) || state.adhkar[0];
    }

    function renderAll() {
      const select = document.getElementById('dhikrSelect');
      select.innerHTML = '';
      state.adhkar.forEach(d => {
        const opt = document.createElement('option');
        opt.value = d.id;
        opt.textContent = d.name;
        if (d.id === state.currentId) opt.selected = true;
        select.appendChild(opt);
      });

      const dhikr = getCurrentDhikr();
      if (!dhikr) return;

      if (state.currentStepIndex >= dhikr.steps.length) {
        state.currentStepIndex = 0;
      }

      const step = dhikr.steps[state.currentStepIndex];
      document.getElementById('dhikrText').textContent = step.text;

      const virtueEl = document.getElementById('dhikrVirtue');
      if (dhikr.virtue && dhikr.virtue.trim() !== '') {
        virtueEl.textContent = dhikr.virtue;
        virtueEl.style.display = 'block';
      } else {
        virtueEl.style.display = 'none';
      }

      const stepHeader = document.getElementById('stepHeader');
      const nextStepBtn = document.getElementById('nextStepBtn');
      if (dhikr.steps.length > 1) {
        stepHeader.style.display = 'flex';
        nextStepBtn.style.display = 'flex';
        document.getElementById('stepTitle').textContent = `الخطوة ${state.currentStepIndex + 1} من ${dhikr.steps.length}`;
        const dotsContainer = document.getElementById('stepsDots');
        dotsContainer.innerHTML = '';
        dhikr.steps.forEach((_, idx) => {
          const dot = document.createElement('span');
          dot.className = 'dot' + (idx === state.currentStepIndex ? ' active' : '');
          dotsContainer.appendChild(dot);
        });
      } else {
        stepHeader.style.display = 'none';
        nextStepBtn.style.display = 'none';
      }

      document.getElementById('countDisplay').textContent = state.remaining;
      document.getElementById('countModeLabel').textContent = step.target > 0 ? 'المتبقي' : 'عدد التسبيحات';
    }

    function selectDhikr(id) {
      state.currentId = id;
      state.currentStepIndex = 0;
      const dhikr = getCurrentDhikr();
      const target = dhikr.steps[0].target;
      state.remaining = target > 0 ? target : 0;
      saveState();
      renderAll();
    }

    function vibrate(ms) {
      if (navigator.vibrate) {
        navigator.vibrate(ms);
      }
    }

    function handleTap() {
      const dhikr = getCurrentDhikr();
      const step = dhikr.steps[state.currentStepIndex];

      if (step.target > 0) {
        if (state.remaining > 1) {
          state.remaining--;
          vibrate(15);
        } else {
          // Completed current step
          vibrate([60, 50, 60]);
          if (state.currentStepIndex < dhikr.steps.length - 1) {
            state.currentStepIndex++;
            const nextStep = dhikr.steps[state.currentStepIndex];
            state.remaining = nextStep.target > 0 ? nextStep.target : 0;
            showToast('انتقلت للخطوة التالية');
          } else {
            state.currentStepIndex = 0;
            const firstStep = dhikr.steps[0];
            state.remaining = firstStep.target > 0 ? firstStep.target : 0;
            showToast('تقبل الله! اكتمل الذكر');
          }
        }
      } else {
        // Open counter (ascending)
        state.remaining++;
        vibrate(15);
      }

      saveState();
      renderAll();
    }

    function resetCurrent() {
      const dhikr = getCurrentDhikr();
      state.currentStepIndex = 0;
      const firstTarget = dhikr.steps[0].target;
      state.remaining = firstTarget > 0 ? firstTarget : 0;
      saveState();
      renderAll();
      showToast('تم تصفير العداد');
    }

    function nextStepManual() {
      const dhikr = getCurrentDhikr();
      if (dhikr.steps.length <= 1) return;
      state.currentStepIndex = (state.currentStepIndex + 1) % dhikr.steps.length;
      const step = dhikr.steps[state.currentStepIndex];
      state.remaining = step.target > 0 ? step.target : 0;
      saveState();
      renderAll();
    }

    // Modals Management
    function openModal(id) {
      document.getElementById(id).classList.add('open');
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('open');
    }

    // Add / Edit Dhikr Form
    function openAddModal() {
      document.getElementById('editModalTitle').textContent = 'إضافة ذكر جديد';
      document.getElementById('editDhikrId').value = '';
      document.getElementById('dhikrNameInput').value = '';
      document.getElementById('dhikrVirtueInput').value = '';
      const container = document.getElementById('stepsContainer');
      container.innerHTML = '';
      addStepField('', 33);
      openModal('editModal');
    }

    function openEditModal(id) {
      const dhikr = state.adhkar.find(d => d.id === id);
      if (!dhikr) return;
      closeModal('manageModal');
      document.getElementById('editModalTitle').textContent = 'تعديل الذكر';
      document.getElementById('editDhikrId').value = dhikr.id;
      document.getElementById('dhikrNameInput').value = dhikr.name;
      document.getElementById('dhikrVirtueInput').value = dhikr.virtue || '';
      const container = document.getElementById('stepsContainer');
      container.innerHTML = '';
      dhikr.steps.forEach(s => addStepField(s.text, s.target));
      openModal('editModal');
    }

    function addStepField(text = '', target = 33) {
      const container = document.getElementById('stepsContainer');
      const idx = container.children.length + 1;
      const div = document.createElement('div');
      div.className = 'step-item-edit';
      div.innerHTML = `
        <div class="step-item-header">
          <span>الخطوة ${idx}</span>
          <button type="button" class="small-btn delete" onclick="removeStepField(this)">حذف الخطوة</button>
        </div>
        <textarea class="form-textarea step-text-val" placeholder="نص التسبيح...">${text}</textarea>
        <div style="display:flex; align-items:center; gap:8px;">
          <span style="font-size:13px; color:var(--text-muted);">العدد (0 = مفتوح):</span>
          <input type="number" class="form-input step-target-val" value="${target}" min="0" style="width:100px; padding:8px;" />
        </div>
      `;
      container.appendChild(div);
      updateStepNumbers();
    }

    function removeStepField(btn) {
      const container = document.getElementById('stepsContainer');
      if (container.children.length <= 1) {
        showToast('يجب وجود خطوة واحدة على الأقل');
        return;
      }
      btn.closest('.step-item-edit').remove();
      updateStepNumbers();
    }

    function updateStepNumbers() {
      const items = document.querySelectorAll('#stepsContainer .step-item-edit');
      items.forEach((item, i) => {
        item.querySelector('.step-item-header span').textContent = `الخطوة ${i + 1}`;
      });
    }

    function saveDhikrForm() {
      const id = document.getElementById('editDhikrId').value;
      const name = document.getElementById('dhikrNameInput').value.trim();
      const virtue = document.getElementById('dhikrVirtueInput').value.trim();
      const stepEls = document.querySelectorAll('#stepsContainer .step-item-edit');

      const steps = [];
      stepEls.forEach(el => {
        const text = el.querySelector('.step-text-val').value.trim();
        const target = parseInt(el.querySelector('.step-target-val').value, 10) || 0;
        if (text) {
          steps.push({ text, target: Math.max(0, target) });
        }
      });

      if (!name) {
        showToast('يرجى كتابة عنوان الذكر');
        return;
      }
      if (steps.length === 0) {
        showToast('يرجى كتابة نص التسبيح');
        return;
      }

      if (id) {
        const idx = state.adhkar.findIndex(d => d.id === id);
        if (idx !== -1) {
          state.adhkar[idx] = { id, name, virtue, steps };
          if (state.currentId === id) {
            state.currentStepIndex = 0;
            state.remaining = steps[0].target > 0 ? steps[0].target : 0;
          }
        }
      } else {
        const newId = 'custom_' + Date.now();
        state.adhkar.push({ id: newId, name, virtue, steps });
        state.currentId = newId;
        state.currentStepIndex = 0;
        state.remaining = steps[0].target > 0 ? steps[0].target : 0;
      }

      saveState();
      renderAll();
      closeModal('editModal');
      showToast('تم حفظ الذكر بنجاح');
    }

    // Manage List (Edit & Delete)
    function openManageModal() {
      renderManageList();
      openModal('manageModal');
    }

    function renderManageList() {
      const container = document.getElementById('manageListContainer');
      container.innerHTML = '';
      state.adhkar.forEach(d => {
        const item = document.createElement('div');
        item.className = 'manage-list-item';
        const totalSteps = d.steps.length > 1 ? `${d.steps.length} خطوات` : (d.steps[0].target > 0 ? `${d.steps[0].target} مرة` : 'مفتوح');
        item.innerHTML = `
          <div class="manage-item-info">
            <div class="manage-item-title">${d.name}</div>
            <div class="manage-item-sub">${totalSteps}</div>
          </div>
          <div class="manage-item-actions">
            <button type="button" class="small-btn" onclick="openEditModal('${d.id}')">تعديل</button>
            <button type="button" class="small-btn delete" onclick="requestDeleteDhikr('${d.id}')">حذف</button>
          </div>
        `;
        container.appendChild(item);
      });
    }

    // Custom Confirm Modal Logic (100% Reliable on iOS)
    let pendingConfirmCallback = null;

    function showCustomConfirm(title, message, onConfirm) {
      document.getElementById('confirmTitle').textContent = title;
      document.getElementById('confirmMessage').textContent = message;
      pendingConfirmCallback = onConfirm;
      openModal('confirmModal');
    }

    document.getElementById('confirmActionBtn').onclick = function() {
      if (pendingConfirmCallback) {
        pendingConfirmCallback();
        pendingConfirmCallback = null;
      }
      closeModal('confirmModal');
    };

    function requestDeleteDhikr(id) {
      if (state.adhkar.length <= 1) {
        showToast('لا يمكن حذف آخر ذكر في القائمة');
        return;
      }
      const dhikr = state.adhkar.find(d => d.id === id);
      showCustomConfirm(
        'حذف الذكر',
        `هل تريد حذف "${dhikr ? dhikr.name : 'هذا الذكر'}" نهائياً؟`,
        () => {
          state.adhkar = state.adhkar.filter(d => d.id !== id);
          if (state.currentId === id) {
            state.currentId = state.adhkar[0].id;
            state.currentStepIndex = 0;
            const target = state.adhkar[0].steps[0].target;
            state.remaining = target > 0 ? target : 0;
          }
          saveState();
          renderManageList();
          renderAll();
          showToast('تم حذف الذكر');
        }
      );
    }

    // Settings
    function openSettingsModal() {
      openModal('settingsModal');
    }

    function setTheme(theme) {
      state.theme = theme;
      applyTheme(theme);
      saveState();
    }

    function applyTheme(theme) {
      if (theme === 'default') {
        document.documentElement.removeAttribute('data-theme');
      } else {
        document.documentElement.setAttribute('data-theme', theme);
      }
      document.querySelectorAll('.theme-option').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('data-set-theme') === theme);
      });
    }

    function setFontSize(val) {
      state.fontSize = parseInt(val, 10);
      applyFontSize(state.fontSize);
      saveState();
    }

    function applyFontSize(size) {
      document.documentElement.style.setProperty('--dhikr-font-size', size + 'px');
      document.getElementById('fontSizeVal').textContent = size;
      document.getElementById('fontSizeSlider').value = size;
    }

    function confirmResetAllData() {
      showCustomConfirm(
        'استعادة الافتراضي',
        'سيتم استرجاع جميع الأذكار الأساسية وحذف التعديلات، هل تريد المتابعة؟',
        () => {
          state.adhkar = JSON.parse(JSON.stringify(DEFAULT_ADHKAR));
          state.currentId = 'd1';
          state.currentStepIndex = 0;
          state.remaining = 100;
          saveState();
          renderAll();
          closeModal('settingsModal');
          showToast('تمت استعادة الأذكار الافتراضية');
        }
      );
    }

    // Initialize
    loadState();
  </script>
</body>
</html>
